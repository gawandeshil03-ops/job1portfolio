name: Build Baby Opportunity Finder APK
on:
  push:
    paths: ['baby_opportunity_finder/**','.github/workflows/baby-opportunity-finder.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Create Android Flutter project
        run: flutter create --platforms=android --org com.shilgawande /tmp/baby_opportunity_finder
      - name: Install app source and dependency
        run: |
          cp baby_opportunity_finder/lib/main.dart /tmp/baby_opportunity_finder/lib/main.dart
          cd /tmp/baby_opportunity_finder
          flutter pub add url_launcher
      - name: Build APK
        run: flutter build apk --debug
        working-directory: /tmp/baby_opportunity_finder
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-opportunity-finder-apk
          path: /tmp/baby_opportunity_finder/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
